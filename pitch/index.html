<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Доступ по паролю</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#F3F1EC;color:#16171B;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B93C1A}
h1{font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.1;letter-spacing:-.015em;margin-top:14px}
p.sub{font-size:15.5px;line-height:1.55;color:#464A53;margin-top:14px}
form{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;background:#FBFAF7;color:#16171B;border:1px solid #CFC9BD;border-radius:999px;
  padding:14px 22px;font-family:inherit;font-size:16px;transition:border-color .2s}
input::placeholder{color:#8A8D94}
input:focus{outline:none;border-color:#16171B}
button{border:none;cursor:pointer;background:#16171B;color:#F3F1EC;border-radius:999px;padding:14px 28px;
  font-family:inherit;font-weight:600;font-size:15px;transition:background .2s,transform .2s}
button:hover:not(:disabled){background:#2C2E35;transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:progress;transform:none}
button:focus-visible,input:focus-visible{outline:2px solid #B93C1A;outline-offset:2px}
.msg{margin-top:16px;font-size:14px;min-height:20px;color:#676A72}
.msg.err{color:#B93C1A}
.shake{animation:sh .4s}
@keyframes sh{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}button:hover{transform:none}}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Демоверсия</div>
  <h1>Материал защищён паролем</h1>
  <p class="sub">Введите пароль, который пришёл вместе со ссылкой. Страница расшифровывается прямо в&nbsp;браузере,
    пароль никуда не&nbsp;отправляется.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Пароль" aria-label="Пароль" autocomplete="current-password"
      autofocus spellcheck="false">
    <button id="go" type="submit">Открыть</button>
  </form>
  <div class="msg" id="m" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  var ITER = 200000;
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), m = document.getElementById('m'),
      card = document.querySelector('.card');

  if (!window.crypto || !crypto.subtle) {
    m.className = 'msg err';
    m.textContent = 'Браузер не поддерживает расшифровку. Откройте ссылку в Safari, Chrome или Firefox по https.';
    go.disabled = true;
    return;
  }

  var b64 = document.getElementById('p').textContent.trim();
  var raw = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  var salt = raw.subarray(0, 16), iv = raw.subarray(16, 28),
      tag  = raw.subarray(28, 44), ct = raw.subarray(44);
  var data = new Uint8Array(ct.length + tag.length);
  data.set(ct); data.set(tag, ct.length);          // WebCrypto ждёт ciphertext||tag

  function open_(pass){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, data); })
      .then(function(buf){
        var html = new TextDecoder('utf-8').decode(buf);
        try { sessionStorage.setItem('sm_k_mm_meeting', pass); } catch (e) {}
        document.open(); document.write(html); document.close();
      });
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var pass = pw.value;
    if (!pass) { pw.focus(); return; }
    go.disabled = true; m.className = 'msg'; m.textContent = 'Расшифровываем…';
    setTimeout(function(){
      open_(pass)['catch'](function(){
        go.disabled = false;
        m.className = 'msg err'; m.textContent = 'Неверный пароль. Проверьте раскладку и попробуйте ещё раз.';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        pw.select();
      });
    }, 30);
  });

  // в рамках одной вкладки пароль спрашиваем один раз
  try {
    var saved = sessionStorage.getItem('sm_k_mm_meeting');
    if (saved) { m.textContent = 'Открываем…'; go.disabled = true; open_(saved)['catch'](function(){
      sessionStorage.removeItem('sm_k_mm_meeting'); go.disabled = false; m.textContent = ''; }); }
  } catch (e) {}
})();
</script>
